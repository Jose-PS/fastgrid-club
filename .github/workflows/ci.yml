name: ci

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - deploy/**
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - .github/workflows/ci.yml
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: SHA de la imagen a desplegar en el VPS
        required: true
        type: string

env:
  IMAGE: ghcr.io/jose-ps/fastgrid-club

permissions:
  contents: read

jobs:
  compose:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validar el compose de producción
        run: deploy/web/check-compose.sh

  image:
    needs: compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Login en GHCR
        if: github.event_name == 'workflow_run'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          load: true
          push: false
          build-args: |
            VITE_APP_NAME=FastGrid
          tags: ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Construir la imagen de backup
        uses: docker/build-push-action@v7
        with:
          context: docker/backup
          load: true
          push: false
          tags: fastgrid-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Escanear la imagen de backup con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          image-ref: fastgrid-backup:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true

      - name: Publicar la imagen escaneada
        if: github.event_name == 'workflow_run'
        run: docker push "$IMAGE:$TAG"
        env:
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

  deploy:
    needs: image
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && needs.image.result == 'success'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}

      - name: Copiar ficheros de despliegue al VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/web/compose.yaml,deploy/web/check-compose.sh,deploy/sites/fastgrid.club.caddy,docker/backup
          target: /opt/fastgrid
          overwrite: true

      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/fastgrid/deploy/web
            test -f .env

            fragment=/opt/edge/sites/fastgrid.club.caddy
            candidate=/opt/fastgrid/deploy/sites/fastgrid.club.caddy
            previous=""
            if [ -f "$fragment" ]; then
              previous=$(mktemp)
              cp "$fragment" "$previous"
            fi
            cp "$candidate" "$fragment"
            if ! docker exec edge-caddy-1 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              if [ -n "$previous" ]; then
                cp "$previous" "$fragment"
              else
                rm -f "$fragment"
              fi
              echo "Caddy rechaza el fragmento nuevo: no se recarga y se restaura el anterior" >&2
              exit 1
            fi
            docker exec edge-caddy-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            if [ -n "$previous" ]; then rm -f "$previous"; fi

            previous_tag=$(grep '^IMAGE_TAG=' .env | tail -n 1 | cut -d= -f2- || true)

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose pull --ignore-buildable

            docker compose up -d --wait db redis
            docker compose run --rm migrate

            docker compose up -d --remove-orphans

            cid=$(docker compose ps -q app)
            ok=0
            for i in $(seq 1 36); do
              estado=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo desconocido)
              if [ "$estado" = "healthy" ]; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              docker compose logs --tail=80 app
              exit 1
            fi

            docker compose exec -T app php artisan schedule:clear-cache

            image_repo=ghcr.io/jose-ps/fastgrid-club
            docker images "$image_repo" --format '{{.Repository}}:{{.Tag}}' \
              | { grep -v -x -F -e "$image_repo:$IMAGE_TAG" -e "$image_repo:${previous_tag:-__sin_tag_anterior__}" || true; } \
              | { grep -v -F ':<none>' || true; } \
              | { xargs -r docker rmi || true; }
            docker image prune -f || true
